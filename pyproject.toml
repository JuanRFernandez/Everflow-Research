[project]
name = "efe-research"
version = "0.1.0"
description = "EverFlow Experience research engine - Phase 0: Alpine partner contact enrichment"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Juan Rodrigo Fernandez" }]
dependencies = [
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",
    "openpyxl>=3.1.5",
    "tenacity>=8.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "phonenumbers>=8.13",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
efe = "efe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/efe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:efe.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
